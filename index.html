<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Graphic Reference Wall</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html{color-scheme:dark;background:#000}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: sticky filter bar over a masonry wall that keeps each work's own proportions. */
:root{
  --bg:#000000; --panel:#111111; --fg:#ecebe6; --mute:#8f8e88; --line:#2a2a28;
  --accent:#ff6b4f; --chip:#1f1f1e; --chip-on:#ecebe6; --chip-on-fg:#000000; --ph:#161615;
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
h1{font-size:17px;font-weight:700;letter-spacing:.02em;margin:0 12px 0 0}
.count{font-family:var(--font-mono);font-size:12px;color:var(--mute)}
.search{flex:1 1 180px;min-width:0;max-width:320px;margin-left:auto;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg)}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.lab{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin-right:2px}
button.chip{font:inherit;font-size:12.5px;border:0;background:var(--chip);color:var(--fg);padding:5px 11px;border-radius:999px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
button.chip:focus-visible,.search:focus-visible,.card:focus-visible,.lb button:focus-visible,.lb a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{padding-top:10px;display:flex;flex-direction:column;gap:8px}
.size{display:flex;align-items:center;gap:8px}
.size input{accent-color:var(--accent);width:110px}
#wall{column-width:var(--col,240px);column-gap:12px;padding-top:16px}
.card{display:block;width:100%;break-inside:avoid;margin:0 0 12px;padding:0;border:0;background:var(--ph);border-radius:3px;overflow:hidden;cursor:zoom-in;position:relative;text-align:left;color:inherit}
.card img{display:block;width:100%;height:auto;opacity:0;transition:opacity .25s}
.card.ok img{opacity:1}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:11.5px;line-height:1.3;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transition:opacity .15s}
.card:hover .cap,.card:focus-visible .cap{opacity:1}
.card.wait{aspect-ratio:3/4}
.empty{padding:60px 0;text-align:center;color:var(--mute)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,9,.94);display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#ecebe6}
.lb[hidden]{display:none}
.lb .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .meta{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;padding-top:12px;font-size:13px}
.lb .meta a{color:#ecebe6}
.lb .btns{display:flex;gap:8px}
.lb button{font:inherit;background:#2a2a27;color:#ecebe6;border:0;border-radius:4px;padding:6px 14px;cursor:pointer}
@media (max-width:560px){.search{max-width:none;margin-left:0}#wall{column-width:150px;column-gap:8px}.card{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){.card img,.card .cap{transition:none}}
#badge:not(:empty){display:inline-block;margin-left:6px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
#gate{min-height:80vh;display:flex;align-items:center;justify-content:center}#gate[hidden]{display:none}#gate form{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}#gate input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg)}
</style>

<div id="gate"><form id="gateForm"><h1>Graphic Reference Wall</h1><label for="pw" class="lab">パスワード</label><input id="pw" type="password" autocomplete="current-password" required><button class="chip" type="submit" style="align-self:flex-start">開く</button><div id="gateMsg" class="count" role="status"></div></form></div>
<div id="app" hidden>
<header class="bar">
  <div class="row">
    <h1>Graphic Reference Wall</h1>
    <span class="count" id="count"></span>
    <button class="chip" id="tg" type="button" aria-expanded="false" aria-controls="sub">絞り込み<span id="badge"></span></button>
    <input class="search" id="q" type="search" placeholder="作家・出典で検索" aria-label="検索">
  </div>
  <div class="sub" id="sub" hidden>
    <div class="grp" id="fOri"><span class="lab">向き</span></div>
    <div class="grp" id="fGrp"><span class="lab">種別</span></div>
    <div class="grp" id="fDes"><span class="lab">作家</span></div>
    <div class="size"><span class="lab">サイズ</span><input id="sz" type="range" min="140" max="420" value="240" aria-label="サイズ"></div>
  </div>
</header>
<main id="wall" aria-live="polite"></main>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="拡大表示">
  <div class="img"><img id="lbImg" alt=""></div>
  <div class="meta">
    <div><strong id="lbD"></strong> <span id="lbS" style="color:#9a9892"></span></div>
    <div class="btns"><a id="lbSrc" href="#" target="_blank" rel="noopener noreferrer">出典サイト</a><a id="lbOrig" href="#" target="_blank" rel="noopener noreferrer">画像を開く</a><button id="lbPrev">←</button><button id="lbNext">→</button><button id="lbClose">閉じる</button></div>
  </div>
</div>

const ORI=[["all","すべて"],["p","縦長"],["l","横長"],["s","正方形"]];
const st={ori:"all",grp:"all",des:"all",q:""};
const ratio=new Map(); // url -> w/h
const bad=new Set();
const wall=document.getElementById("wall");
const cards=new Map();
function oriOf(r){return r>1.15?"l":r<0.87?"p":"s"}
function mkChips(id,list,key){
  const box=document.getElementById(id);
  list.forEach(([v,t])=>{const b=document.createElement("button");b.className="chip";b.type="button";b.dataset.v=v;b.textContent=t;
    b.setAttribute("aria-pressed",String(st[key]===v));
    b.onclick=()=>{st[key]=v;[...box.querySelectorAll("button")].forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===v)));render()};box.appendChild(b)});
}
function visible(i){
  if(bad.has(i.u))return false;
  if(st.grp!=="all"&&i.g!==st.grp)return false;
  if(st.des==="__masters"){if(i.g!=="名作")return false}else if(st.des!=="all"&&i.d!==st.des)return false;
  if(st.ori!=="all"){const r=ratio.get(i.u);if(r===undefined||oriOf(r)!==st.ori)return false}
  if(st.q){const s=(i.d+" "+i.s+" "+i.g).toLowerCase();if(!s.includes(st.q))return false}
  return true;
}
function build(){
  DATA.forEach((i,idx)=>{
    const c=document.createElement("button");c.type="button";c.className="card wait";c.setAttribute("aria-label",i.d+" の作品を拡大");
    const im=document.createElement("img");im.loading="lazy";im.decoding="async";im.referrerPolicy="no-referrer";im.alt=i.d;im.src=i.u;
    im.onload=()=>{c.classList.remove("wait");c.classList.add("ok");ratio.set(i.u,im.naturalWidth/im.naturalHeight);scheduleRender()};
    im.onerror=()=>{bad.add(i.u);scheduleRender()};
    const cap=document.createElement("div");cap.className="cap";cap.textContent=i.d;
    c.append(im,cap);c.onclick=()=>openLb(idx);cards.set(i.u,c);
  });
}
let tm=0;function scheduleRender(){clearTimeout(tm);tm=setTimeout(render,120)}
let shown=[];
function render(){
  updBadge();
  shown=DATA.filter(visible);
  const frag=document.createDocumentFragment();
  shown.forEach(i=>frag.appendChild(cards.get(i.u)));
  wall.replaceChildren(frag);
  if(!shown.length){const e=document.createElement("div");e.className="empty";e.textContent=st.ori!=="all"&&ratio.size<DATA.length-bad.size?"画像の大きさを読み込み中です":"条件に合う画像がありません";wall.appendChild(e)}
  document.getElementById("count").textContent=shown.length+" / "+(DATA.length-bad.size)+" 枚";
}
const tg=document.getElementById("tg"),sub=document.getElementById("sub");
tg.onclick=()=>{const open=sub.hidden;sub.hidden=!open;tg.setAttribute("aria-expanded",String(open))};
function updBadge(){const n=(st.ori!=="all")+(st.grp!=="all")+(st.des!=="all");document.getElementById("badge").textContent=n||""}
document.getElementById("q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};
document.getElementById("sz").oninput=e=>{wall.style.setProperty("--col",e.target.value+"px")};
// lightbox
const lb=document.getElementById("lb");let cur=0;
function openLb(idx){const i=DATA[idx];cur=shown.indexOf(i);if(cur<0)cur=0;showLb()}
function showLb(){const i=shown[cur];if(!i)return;
  document.getElementById("lbImg").src=i.u;document.getElementById("lbD").textContent=i.d;document.getElementById("lbS").textContent=i.s;
  document.getElementById("lbSrc").href=i.l;document.getElementById("lbOrig").href=i.u;lb.hidden=false}
function step(n){if(!shown.length)return;cur=(cur+n+shown.length)%shown.length;showLb()}
document.getElementById("lbPrev").onclick=()=>step(-1);document.getElementById("lbNext").onclick=()=>step(1);
document.getElementById("lbClose").onclick=()=>{lb.hidden=true};
lb.addEventListener("click",e=>{if(e.target.classList.contains("img")||e.target===lb)lb.hidden=true});
document.addEventListener("keydown",e=>{if(lb.hidden)return;if(e.key==="Escape")lb.hidden=true;if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
// preload sizes so the orientation filter works before images scroll into view
function preload(){const q=DATA.map(i=>i.u);let n=0;
  const next=()=>{const u=q.shift();if(!u)return;if(ratio.has(u)||bad.has(u)){next();return}
    const im=new Image();im.referrerPolicy="no-referrer";im.onload=()=>{ratio.set(u,im.naturalWidth/im.naturalHeight);scheduleRender();next()};im.onerror=()=>{bad.add(u);scheduleRender();next()};im.src=u};
  for(let k=0;k<6;k++)next()}

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.i)},key,b64(ENC.c));
  DATA=JSON.parse(new TextDecoder().decode(pt));
}
function start(){document.getElementById("gate").hidden=true;document.getElementById("app").hidden=false;
  const desCount={};DATA.forEach(i=>desCount[i.d]=(desCount[i.d]||0)+1);
  mkChips("fOri",ORI,"ori");mkChips("fGrp",[["all","すべて"],["現代作家","現代作家"],["美術館","美術館"],["名作","名作"]],"grp");
  const top=Object.keys(desCount).filter(d=>/Feixen|田部井|GOO|武蔵野|上西|杉浦|北極|田中/.test(d)).map(d=>[d,d.replace("Felix Pfäffli / Studio Feixen","Pfäffli / Feixen").replace("武蔵野美術大学美術館","武蔵美 美術館")]);
  mkChips("fDes",[["all","全員"],...top,["__masters","名作の作家"]],"des");
  build();render();preload();}
const gateForm=document.getElementById("gateForm"),gateMsg=document.getElementById("gateMsg");
async function tryPw(pw,silent){try{await unlock(pw);try{localStorage.setItem("dw",pw)}catch(e){}start();return true}catch(e){if(!silent)gateMsg.textContent="パスワードが違います";return false}}
gateForm.addEventListener("submit",e=>{e.preventDefault();gateMsg.textContent="確認中…";tryPw(document.getElementById("pw").value,false)});
let saved=null;try{saved=localStorage.getItem("dw")}catch(e){}
if(saved)tryPw(saved,true);

</script>
